---
- name: Fix Proxmox repos to use no-subscription
  hosts: proxmox
  become: true
  tasks:
    - name: Disable enterprise PVE repo
      shell: |
        sed -i 's/^Enabled: yes/Enabled: no/' /etc/apt/sources.list.d/pve-enterprise.sources
        echo "Enabled: no" >> /etc/apt/sources.list.d/pve-enterprise.sources
      ignore_errors: yes

    - name: Disable enterprise Ceph repo
      shell: |
        sed -i 's/^Enabled: yes/Enabled: no/' /etc/apt/sources.list.d/ceph.sources
        echo "Enabled: no" >> /etc/apt/sources.list.d/ceph.sources
      ignore_errors: yes

    - name: Add PVE no-subscription repo
      copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.list
        content: |
          deb http://download.proxmox.com/debian/pve trixie pve-no-subscription
          deb http://download.proxmox.com/debian/ceph-squid trixie no-subscription

    - name: Update apt cache
      apt:
        update_cache: yes
