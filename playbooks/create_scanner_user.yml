---
- name: Create Nessus scanner user
  hosts: all
  become: true
  tasks:
    - name: Create scanner user
      user:
        name: nessus
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Add nessus to sudoers with NOPASSWD
      copy:
        dest: /etc/sudoers.d/nessus
        content: "nessus ALL=(ALL) NOPASSWD: ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Create .ssh directory
      file:
        path: /home/nessus/.ssh
        state: directory
        owner: nessus
        group: nessus
        mode: '0700'
