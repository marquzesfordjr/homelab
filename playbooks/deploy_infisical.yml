---
- name: Deploy Infisical
  hosts: infisical
  become: true
  tasks:
    - name: Create infisical directory
      file:
        path: /opt/infisical
        state: directory

    - name: Deploy docker-compose
      copy:
        dest: /opt/infisical/docker-compose.yml
        content: |
          services:
            db:
              image: postgres:14-alpine
              container_name: infisical-db
              restart: unless-stopped
              volumes:
                - /opt/infisical/db:/var/lib/postgresql/data
              environment:
                - POSTGRES_PASSWORD=infisicalpass
                - POSTGRES_DB=infisical

            redis:
              image: redis:7-alpine
              container_name: infisical-redis
              restart: unless-stopped

            infisical:
              image: infisical/infisical:latest
              container_name: infisical
              restart: unless-stopped
              ports:
                - 8080:8080
              environment:
                - ENCRYPTION_KEY=6c1fe4e807877f1b53b4a99f3c7a63d3
                - AUTH_SECRET=6c1fe4e807877f1b53b4a99f3c7a63d3aabbccdd
                - DB_CONNECTION_URI=postgresql://postgres:infisicalpass@db:5432/infisical
                - REDIS_URL=redis://redis:6379
                - SITE_URL=http://10.20.0.212:8080
              depends_on:
                - db
                - redis

    - name: Start infisical
      shell: docker compose up -d
      args:
        chdir: /opt/infisical
