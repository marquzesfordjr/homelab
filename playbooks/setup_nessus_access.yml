---
- name: Setup Nessus scanner access on host
  hosts: "{{ target | default('all:!homeassistant') }}"
  become: true
  tasks:
    - name: Create nessus user
      user:
        name: nessus
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Create sudoers.d if missing
      file:
        path: /etc/sudoers.d
        state: directory
        mode: '0755'

    - name: Add nessus to sudoers
      copy:
        dest: /etc/sudoers.d/nessus
        content: "nessus ALL=(ALL) NOPASSWD: ALL\n"
        mode: '0440'

    - name: Create nessus .ssh directory
      file:
        path: /home/nessus/.ssh
        state: directory
        owner: nessus
        group: nessus
        mode: '0700'

    - name: Add Nessus scanner public key
      authorized_key:
        user: nessus
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItbwYAjTTX2WczPdKeX2GFlXxXPvoe9TwVxnBemfiEn nessus-scanner"
        state: present
