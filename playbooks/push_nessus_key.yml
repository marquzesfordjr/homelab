---
- name: Push Nessus scanner public key to all hosts
  hosts: all:!nessus
  become: true
  vars:
    nessus_pub_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItbwYAjTTX2WczPdKeX2GFlXxXPvoe9TwVxnBemfiEn nessus-scanner"
  tasks:
    - name: Create nessus user
      user:
        name: nessus
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Install sudo if missing
      package:
        name: sudo
        state: present
      ignore_errors: yes

    - name: Create sudoers.d directory if missing
      file:
        path: /etc/sudoers.d
        state: directory
        mode: '0755'

    - name: Add nessus to sudoers with NOPASSWD
      copy:
        dest: /etc/sudoers.d/nessus
        content: "nessus ALL=(ALL) NOPASSWD: ALL\n"
        mode: '0440'

    - name: Create .ssh directory for nessus user
      file:
        path: /home/nessus/.ssh
        state: directory
        owner: nessus
        group: nessus
        mode: '0700'

    - name: Push Nessus scanner public key
      authorized_key:
        user: nessus
        key: "{{ nessus_pub_key }}"
        state: present
