---
- name: Deploy Navidrome
  hosts: navidrome
  become: true
  tasks:
    - name: Create navidrome directories
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - /opt/navidrome/data
        - /opt/navidrome/music

    - name: Deploy docker-compose
      copy:
        dest: /opt/navidrome/docker-compose.yml
        content: |
          services:
            navidrome:
              image: deluan/navidrome:latest
              container_name: navidrome
              restart: unless-stopped
              ports:
                - 4533:4533
              environment:
                - ND_SCANSCHEDULE=1h
                - ND_LOGLEVEL=info
                - ND_SESSIONTIMEOUT=24h
              volumes:
                - /opt/navidrome/data:/data
                - /opt/navidrome/music:/music:ro

    - name: Start navidrome
      shell: docker compose up -d
      args:
        chdir: /opt/navidrome
