---
- name: Add host to inventory
  hosts: ansible-01
  become: true
  tasks:
    - name: Add host to inventory file
      shell: |
        python3 << 'PYEOF'
        import yaml

        with open('/root/homelab/inventories/hosts.yml', 'r') as f:
            inv = yaml.safe_load(f)

        group = "{{ host_group | default('lxc') }}"
        name = "{{ host_name }}"
        ip = "{{ host_ip }}"

        inv['all']['children'][group]['hosts'][name] = {'ansible_host': ip}

        with open('/root/homelab/inventories/hosts.yml', 'w') as f:
            yaml.dump(inv, f, default_flow_style=False)

        print(f"Added {name} ({ip}) to group {group}")
        PYEOF

    - name: Show confirmation
      shell: grep -A2 "{{ host_name }}" /root/homelab/inventories/hosts.yml
      register: result

    - name: Display result
      debug:
        msg: "{{ result.stdout_lines }}"
