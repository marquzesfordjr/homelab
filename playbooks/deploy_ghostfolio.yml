---
- name: Deploy Ghostfolio
  hosts: ghostfolio
  become: true
  tasks:
    - name: Create ghostfolio directory
      file:
        path: /opt/ghostfolio
        state: directory

    - name: Deploy docker-compose
      copy:
        dest: /opt/ghostfolio/docker-compose.yml
        content: |
          services:
            postgres:
              image: postgres:15
              container_name: ghostfolio-db
              restart: unless-stopped
              volumes:
                - /opt/ghostfolio/db:/var/lib/postgresql/data
              environment:
                - POSTGRES_USER=ghostfolio
                - POSTGRES_PASSWORD=ghostfoliopass
                - POSTGRES_DB=ghostfolio-db

            redis:
              image: redis:alpine
              container_name: ghostfolio-redis
              restart: unless-stopped

            ghostfolio:
              image: ghostfolio/ghostfolio:latest
              container_name: ghostfolio
              restart: unless-stopped
              ports:
                - 3333:3333
              environment:
                - DATABASE_URL=postgresql://ghostfolio:ghostfoliopass@postgres:5432/ghostfolio-db?sslmode=prefer
                - REDIS_HOST=redis
                - REDIS_PORT=6379
                - JWT_SECRET_KEY=6c1fe4e807877f1b53b4a99f3c7a63d3aabbccddee
                - ACCESS_TOKEN_SALT=6c1fe4e807877f1b53b4a99f3c7a63d3aabbccddff
              depends_on:
                - postgres
                - redis

    - name: Start ghostfolio
      shell: docker compose up -d
      args:
        chdir: /opt/ghostfolio
