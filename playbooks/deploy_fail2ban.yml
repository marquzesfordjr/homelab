---
- name: Deploy Fail2Ban
  hosts: fail2ban
  become: true
  tasks:
    - name: Create fail2ban directory
      file:
        path: /opt/fail2ban
        state: directory

    - name: Deploy docker-compose
      copy:
        dest: /opt/fail2ban/docker-compose.yml
        content: |
          services:
            fail2ban:
              image: crazymax/fail2ban:latest
              container_name: fail2ban
              network_mode: host
              cap_add:
                - NET_ADMIN
                - NET_RAW
              restart: unless-stopped
              volumes:
                - /opt/fail2ban/data:/data
                - /var/log:/var/log:ro

    - name: Start fail2ban
      shell: docker compose up -d
      args:
        chdir: /opt/fail2ban
