---
- name: Create dedicated Nessus scanner user
  hosts: all
  become: true
  vars:
    nessus_pub_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItbwYAjTTX2WczPdKeX2GFlXxXPvoe9TwVxnBemfiEn nessus-scanner"
  tasks:
    - name: Create nessus user
      user:
        name: nessus
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Add nessus to sudoers with NOPASSWD
      copy:
        dest: /etc/sudoers.d/nessus
        content: |
          nessus ALL=(ALL) NOPASSWD: ALL
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Create .ssh directory for nessus user
      file:
        path: /home/nessus/.ssh
        state: directory
        owner: nessus
        group: nessus
        mode: '0700'

    - name: Add Nessus scanner public key
      authorized_key:
        user: nessus
        key: "{{ nessus_pub_key }}"
        state: present
