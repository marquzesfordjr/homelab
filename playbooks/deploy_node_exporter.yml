---
- name: Deploy Prometheus Node Exporter on Proxmox nodes
  hosts: proxmox
  become: true
  tasks:
    - name: Install node exporter
      apt:
        name: prometheus-node-exporter
        state: present
        update_cache: yes

    - name: Enable and start node exporter
      service:
        name: prometheus-node-exporter
        state: started
        enabled: yes
