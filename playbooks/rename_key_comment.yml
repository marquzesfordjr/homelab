---
- name: Rename macbook key comment on all hosts
  hosts: "all:!homeassistant"
  become: true
  vars:
    keys_file: "{{ '/root/.ssh/authorized_keys' if ansible_user == 'root' else '/home/' ~ ansible_user ~ '/.ssh/authorized_keys' }}"
  tasks:
    - name: Check authorized_keys exists
      stat:
        path: "{{ keys_file }}"
      register: keys_stat

    - name: Rename comment only, key material untouched
      replace:
        path: "{{ keys_file }}"
        regexp: '^(ssh-ed25519 \S+) macbook-firewall$'
        replace: '\1 macbook'
      when: keys_stat.stat.exists
