---
- name: Deploy Splunk
  hosts: splunk
  become: true
  tasks:
    - name: Create splunk directory
      file:
        path: /opt/splunk/etc
        state: directory

    - name: Deploy docker-compose
      copy:
        dest: /opt/splunk/docker-compose.yml
        content: |
          services:
            splunk:
              image: splunk/splunk:latest
              container_name: splunk
              restart: unless-stopped
              environment:
                - SPLUNK_START_ARGS=--accept-license
                - SPLUNK_PASSWORD=ChangeThisPassword123!
              ports:
                - 8000:8000
                - 8088:8088
                - 8089:8089
                - 9997:9997
              volumes:
                - /opt/splunk/etc:/opt/splunk/etc
              ulimits:
                nofile:
                  soft: 64000
                  hard: 64000

    - name: Start splunk
      shell: docker compose up -d
      args:
        chdir: /opt/splunk
