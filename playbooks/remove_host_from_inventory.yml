---
- name: Remove host from inventory
  hosts: ansible-01
  become: true
  tasks:
    - name: Show inventory before
      command: python3 /root/homelab/scripts/show_inventory.py
      register: before

    - name: Display before
      debug:
        msg: "{{ before.stdout_lines }}"

    - name: Remove host
      command: python3 /root/homelab/scripts/remove_host.py {{ host_name }}
      register: result

    - name: Display result
      debug:
        msg: "{{ result.stdout_lines }}"

    - name: Show inventory after
      command: python3 /root/homelab/scripts/show_inventory.py
      register: after

    - name: Display after
      debug:
        msg: "{{ after.stdout_lines }}"

    - name: Git sync
      shell: cd /root/homelab && git add -A && git commit -m "Remove {{ host_name }} from inventory" && git push origin main
