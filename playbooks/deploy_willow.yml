---
- name: Deploy Willow Application Server
  hosts: willow
  become: true
  tasks:
    - name: Create willow directory
      file:
        path: /opt/willow/data
        state: directory

    - name: Deploy docker-compose
      copy:
        dest: /opt/willow/docker-compose.yml
        content: |
          services:
            willow:
              image: ghcr.io/heywillow/willow-application-server:latest
              container_name: willow-was
              restart: unless-stopped
              network_mode: bridge
              ports:
                - 8502:8502
              volumes:
                - /opt/willow/data:/app/storage
              environment:
                - TZ=America/New_York

    - name: Start willow
      shell: docker compose up -d
      args:
        chdir: /opt/willow
