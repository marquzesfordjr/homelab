---
- name: Deploy PeaNUT
  hosts: peanut
  become: true
  tasks:
    - name: Create peanut directory
      file:
        path: /opt/peanut/config
        state: directory

    - name: Deploy docker-compose
      copy:
        dest: /opt/peanut/docker-compose.yml
        content: |
          services:
            peanut:
              image: brandawg93/peanut:latest
              container_name: peanut
              restart: unless-stopped
              volumes:
                - /opt/peanut/config:/config
              ports:
                - 8080:8080
              environment:
                - WEB_PORT=8080

    - name: Start peanut
      shell: docker compose up -d
      args:
        chdir: /opt/peanut
